# ~/.config/tmuxinator/beamjobs.yml
# Tmuxinator config for BeamJobs monorepo development

name: beamjobs
root: ~/Workspace/beamjobs

# Project hooks
on_project_start: echo "Starting BeamJobs monorepo development environment..."
on_project_exit: echo "Shutting down BeamJobs development environment..."

windows:
  # Single nvim instance for entire monorepo
  - :
      root: ~/Workspace/beamjobs
      panes:
        - nvim .

  # Frontend dev server + ngrok
  - :
      root: ~/Workspace/beamjobs
      layout: main-horizontal
      panes:
        - just fe:dev
        - just fe:ngrok

  # Backend dev server + workers + ngrok
  - :
      root: ~/Workspace/beamjobs
      layout: tiled
      panes:
        - just be:dev
        - just be:worker:public
        - just be:worker:internal
        - just be:ngrok

  # Monorepo root terminal
  - :
      root: ~/Workspace/beamjobs

