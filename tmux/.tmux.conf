# Unbind default prefix
unbind C-b

# Set new prefix to C-a. Caps lock is mapped to control via system preferences.
set-option -g prefix C-a

# Bind C-a C-a to send C-a to the application (in case you need literal C-a)
bind-key C-a send-prefix

# <leader>r to reload conf
unbind r
bind r source-file ~/.tmux.conf

# vim-style pane navigation with <leader>h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# vim-style pane resizing with <leader>H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# More intuitive pane split keybindings and open new window/pane at path of current window
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"' # was vertial split
unbind % # was horizontal split

# vim-style copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# Enable extended support for some more sophisticated terminal emulator
# Disable waiting time when pressing escape, for smoother Neovim usage. Disable
# if differentiation between function and meta keycombination is needed.
set-option -s escape-time 0

# Quality of life
set -g mouse on
set -g base-index 1 # Start counting windows from 1 instead of 0 for more intuitive quick switching.
setw -g pane-base-index 1
set -g renumber-windows on 
set -g history-limit 100000
set -g set-titles on 
set -g set-titles-string "#{pane_title}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'vaaleyard/tmux-dotbar'

# Configure tmux-dotbar UI with tokyonight-storm colors
# TokyoNight Storm palette (from folke/tokyonight.nvim)
# bg: #24283b           bg_dark: #1f2335       bg_dark1: #1b1e2d
# bg_highlight: #292e42 fg: #c0caf5           fg_dark: #a9b1d6
# fg_gutter: #3b4261    comment: #565f89       dark3: #545c7e
# dark5: #737aa2        blue: #7aa2f7          blue0: #3d59a1
# blue1: #2ac3de        blue2: #0db9d7         blue5: #89ddff
# blue6: #b4f9f8        blue7: #394b70         cyan: #7dcfff
# green: #9ece6a        green1: #73daca        green2: #41a6b5
# yellow: #e0af68       orange: #ff9e64        red: #f7768e
# red1: #db4b4b         magenta: #bb9af7       magenta2: #ff007c
# purple: #9d7cd8       teal: #1abc9c          terminal_black: #414868
set -g @tmux-dotbar-bg "default"
set -g @tmux-dotbar-fg "#565f89"                # comment - inactive window dots
set -g @tmux-dotbar-fg-current "#a9b1d6"        # fg_dark - current/zoomed window
set -g @tmux-dotbar-fg-session "#737aa2"        # dark5 - session name
set -g @tmux-dotbar-fg-prefix "#7dcfff"         # cyan - prefix indicator


