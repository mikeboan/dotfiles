# === PREFIX CONFIGURATION ===
# Common options: C-a, C-Space, C-s, C-q
# PREFIX="C-a"
# TMUX_PREFIX="C-s"
# TMUX_PREFIX="C-q"
TMUX_PREFIX="C-Space"

# Unbind default prefix
unbind C-b

# Set new prefix (Caps lock is mapped to control via system preferences)
set-option -g prefix $TMUX_PREFIX

# Bind <prefix><prefix> to send literal prefix to the application
bind-key $TMUX_PREFIX send-prefix

# <leader>r to reload conf
unbind r
bind r source-file ~/.tmux.conf

# Enable 24-bit true color support
# Use wezterm as default terminal for proper color support
# Requires wezterm terminfo to be installed (handled by bootstrap.sh)
set -g default-terminal "wezterm"
# Add RGB support for wezterm and fallback terminals (iTerm, etc.)
set -ag terminal-overrides ",wezterm:RGB,xterm-256color:RGB"

# Popup terminals
bind g display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "lazygit"
bind t display-popup -E -w 80% -h 80% -d "#{pane_current_path}"

# vim-style pane navigation with <leader>h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# vim-style pane resizing with <leader>H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# More intuitive pane split keybindings and open new window/pane at path of current window
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"' # was vertial split
unbind % # was horizontal split

# Open new windows in current path
bind c new-window -c "#{pane_current_path}"

# vim-style copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
# y to copy and stay in copy mode (use q to exit)
bind-key -T copy-mode-vi 'y' send -X copy-selection
# Y to copy and exit copy mode (old behavior)
bind-key -T copy-mode-vi 'Y' send -X copy-selection-and-cancel

# Mouse drag behavior: copy selection but stay in copy mode
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection

# Double-click to select word and stay in copy mode
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-selection

# Triple-click to select line and stay in copy mode
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; send -X copy-selection

# Enable extended support for some more sophisticated terminal emulator
# Disable waiting time when pressing escape, for smoother Neovim usage. Disable
# if differentiation between function and meta keycombination is needed.
set-option -s escape-time 0

# Allow cursor style (blinking, shape) to pass through to the terminal
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'

# Quality of life
set -g mouse on
set -g base-index 1 # Start counting windows from 1 instead of 0 for more intuitive quick switching.
setw -g pane-base-index 1
set -g renumber-windows on 
set -g history-limit 100000
set -g set-titles on 
set -g set-titles-string "#{pane_title}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'vaaleyard/tmux-dotbar'

# Configure tmux-dotbar UI
# Theme colors are sourced from central theme configuration
# This section is automatically updated by the theme switcher
# ===== THEME START (DO NOT EDIT MANUALLY) =====
set -g @tmux-dotbar-bg "default"
set -g @tmux-dotbar-fg "#565f89"                # comment - inactive window dots
set -g @tmux-dotbar-fg-current "#a9b1d6"        # fg_dark - current/zoomed window
set -g @tmux-dotbar-fg-session "#737aa2"        # dark5 - session name
set -g @tmux-dotbar-fg-prefix "#7dcfff"         # cyan - prefix indicator
set -g pane-active-border-style "fg=#7dcfff"    # cyan - active pane border
set -g @tmux-dotbar-right true
set -g @tmux-dotbar-status-right "#(cd #{pane_current_path}; git branch --show-current 2>/dev/null)"
# ===== THEME END =====


