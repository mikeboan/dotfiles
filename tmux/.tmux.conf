# === PREFIX CONFIGURATION ===
# Common options: C-a, C-Space, C-s, C-q
# PREFIX="C-a"
# TMUX_PREFIX="C-s"
# TMUX_PREFIX="C-q"
TMUX_PREFIX="C-Space"

# Unbind default prefix
unbind C-b

# Set new prefix (Caps lock is mapped to control via system preferences)
set-option -g prefix $TMUX_PREFIX

set-option -g focus-events

# Bind <prefix><prefix> to send literal prefix to the application
bind-key $TMUX_PREFIX send-prefix

# <leader>r to reload conf
unbind r
bind r source-file ~/.tmux.conf

# Enable 24-bit true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB,xterm-256color:RGB"

# Forward modifier keys (Shift+Enter, Ctrl+Enter, etc.) to terminal apps like Pi
set -g extended-keys on
set -g extended-keys-format csi-u

# focus-events for Claude Code
set -g focus-events on

# Popup terminals
bind g display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "lazygit"
bind t display-popup -E -w 80% -h 80% -d "#{pane_current_path}"

# Prefix+e → capture full pane history into nvim popup (terminal-agnostic scrollback)
bind e capture-pane -S - \; save-buffer /tmp/tmux-scrollback.txt \; display-popup -E -w 90% -h 90% "nvim + /tmp/tmux-scrollback.txt"

# vim-style pane navigation with <leader>h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# vim-style pane resizing with <leader>H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# More intuitive pane split keybindings and open new window/pane at path of current window
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"' # was vertial split
unbind % # was horizontal split

# Open new windows in current path
bind c new-window -c "#{pane_current_path}"

# Break pane into a new window, then prompt for name (empty default)
bind ! break-pane \; command-prompt -I "" "rename-window -- '%%'"

# Open a new pane with nvim at git root (or cwd if not in a repo)
bind v split-window -h -c "#{pane_current_path}" "DIR=\$(git rev-parse --show-toplevel 2>/dev/null || pwd) && cd \$DIR && nvim \$DIR"
bind V split-window -v -c "#{pane_current_path}" "DIR=\$(git rev-parse --show-toplevel 2>/dev/null || pwd) && cd \$DIR && nvim \$DIR"

# Open a new pane with Claude Code at git root (or cwd if not in a repo)
bind a split-window -h -c "#{pane_current_path}" "cd \$(git rev-parse --show-toplevel 2>/dev/null || pwd) && claude"
bind A split-window -v -c "#{pane_current_path}" "cd \$(git rev-parse --show-toplevel 2>/dev/null || pwd) && claude"

# Prefix-free tmux commands (terminal sends Alt+key, tmux catches with -n)
# CMD+t → new window, CMD+w → close pane
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-w kill-pane

# CMD+z → toggle pane zoom
bind -n M-z resize-pane -Z

# CMD+Shift+[ / ] → previous/next window
bind -n M-, previous-window
bind -n M-. next-window

# CMD+N → select window N
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# vim-style copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi C-v send -X rectangle-toggle

# y to copy to system clipboard and stay in copy mode (use q to exit)
bind-key -T copy-mode-vi y send -X copy-pipe "pbcopy"
# Y to copy to system clipboard and exit copy mode
bind-key -T copy-mode-vi Y send -X copy-pipe-and-cancel "pbcopy"
# Enter to copy to system clipboard and exit copy mode
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"

# Mouse drag: copy to clipboard and stay in copy mode (use q to exit)
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe "pbcopy"

# Double-click to select word and copy to system clipboard (stay in copy mode when already in it)
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; run-shell -d 0.3 "" \; send -X copy-pipe "pbcopy"
bind-key -T root DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H; send -X select-word; run-shell -d 0.3 ""; send -X copy-pipe-and-cancel "pbcopy" }

# Triple-click to select line and copy to system clipboard (stay in copy mode when already in it)
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; run-shell -d 0.3 "" \; send -X copy-pipe "pbcopy"
bind-key -T root TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H; send -X select-line; run-shell -d 0.3 ""; send -X copy-pipe-and-cancel "pbcopy" }

# Enable extended support for some more sophisticated terminal emulator
# Disable waiting time when pressing escape, for smoother Neovim usage. Disable
# if differentiation between function and meta keycombination is needed.
set-option -s escape-time 0

# Allow cursor style (blinking, shape) to pass through to the terminal
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'

# Undercurl + colored underline pass-through (Neovim diagnostics)
set -ga terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -ga terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Quality of life
set -g mouse on
set -g base-index 1 # Start counting windows from 1 instead of 0 for more intuitive quick switching.
setw -g pane-base-index 1
set -g renumber-windows on 
set -g history-limit 100000

# OSC 52 clipboard passthrough (nvim "+y works even nested in tmux/SSH)
set -g allow-passthrough on
set -s set-clipboard on

set -g set-titles on
set -g set-titles-string "#{pane_title}"
set -g detach-on-destroy off  # switch to next session instead of detaching when killing one

# Session management with sesh (prefix+T to open picker)
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '> ' \
    --header ' ^a all ^t tmux ^g configs ^x zoxide ^d kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(> )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(tmux> )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(configs> )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(zoxide> )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(find> )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(> )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# Quick toggle to last session
bind-key L switch-client -l

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'vaaleyard/tmux-dotbar'
set -g @plugin 'Peter-McKinney/tmux-fzf-open-files-nvim'

# Configure tmux-dotbar UI
# Theme colors are sourced from central theme configuration
# This section is automatically updated by the theme switcher
# ===== THEME START (DO NOT EDIT MANUALLY) =====
set -g @tmux-dotbar-bg "default"
set -g @tmux-dotbar-fg "#565f89"                # comment - inactive window dots
set -g @tmux-dotbar-fg-current "#a9b1d6"        # fg_dark - current/zoomed window
set -g @tmux-dotbar-fg-session "#737aa2"        # dark5 - session name
set -g @tmux-dotbar-fg-prefix "#7dcfff"         # cyan - prefix indicator
# set -g pane-active-border-style "fg=#7dcfff"   # cyan - active pane border (previous)
set -g pane-active-border-style "fg=#ff9e64"    # orange - active pane border (tokyonight-storm orange)
 set -g pane-border-style "fg=#3b4261"          # fg_gutter - subtle inactive border (option A)
# set -g pane-border-style "fg=#2f344d"           # darker - very subtle inactive border, close to bg_highlight (option B)
# set -g pane-border-indicators arrows
set -g pane-border-indicators colour
# set -g pane-border-lines double
set -g pane-border-lines heavy
set -g pane-border-status off
# set -g window-style 'bg=#292e42'               # washed-out bg for inactive panes (current: bg_highlight, subtle)
# Audition more washed-out inactive backgrounds (uncomment one at a time):
 set -g window-style 'bg=#2b3149'               # barely+ (midpoint between current and 2d3350)
# set -g window-style 'bg=#2d3350'               # subtle+ (slight lift from bg_highlight)
# set -g window-style 'bg=#323856'               # moderate (noticeably lighter)
# set -g window-style 'bg=#3b4261'               # strong (fg_gutter — clearly distinct)
# set -g window-style 'bg=#414868'               # stronger (terminal_black — very obvious)
# set -g window-style 'bg=#4a5280'               # aggressive (approaches comment grey)
set -g window-active-style 'bg=#24283b'        # normal bg for active pane
set -g @tmux-dotbar-right true
set -g @tmux-dotbar-status-right "#(cd #{pane_current_path}; repo=$(basename $(git rev-parse --show-toplevel 2>/dev/null) 2>/dev/null); branch=$(git branch --show-current 2>/dev/null); [ -n \"$branch\" ] && echo \"${repo}:${branch}\")"
# ===== THEME END =====


# bootstrap tpm
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

