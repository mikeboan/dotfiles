# Aerospace tiling window manager
# Keys: alt = main modifier, alt+shift = move/modify

# Start at login
start-at-login = true

# Don't bother with the slide animation
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# When you focus a window on another monitor, move mouse there
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Gaps between windows (pixels)
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.right = 10
outer.top = 10
outer.bottom = 10

# -------------------------------------------------------------------
# Key bindings
# -------------------------------------------------------------------

# Focus: alt + hjkl
[mode.main.binding]
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move windows: alt+shift + hjkl
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Resize: alt+ctrl + hjkl
alt-ctrl-h = 'resize width -50'
alt-ctrl-j = 'resize height +50'
alt-ctrl-k = 'resize height -50'
alt-ctrl-l = 'resize width +50'

# Layout
alt-f = 'fullscreen'
alt-shift-f = 'layout floating tiling'    # toggle floating for current window
alt-e = 'layout tiles horizontal vertical' # toggle split direction
alt-shift-e = 'layout accordion horizontal vertical'

# Workspaces: alt + number
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'

# Move window to workspace: alt+shift + number
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'

# Quick actions
alt-shift-r = 'reload-config'
alt-shift-backspace = 'close-all-windows-but-current'

# -------------------------------------------------------------------
# Float rules — apps that shouldn't tile
# -------------------------------------------------------------------

[[on-window-detected]]
if.app-id = 'com.apple.Stickies'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.SystemPreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.raycast.macos'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.1password.1password'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.MusicDecoy'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'layout floating'

# Cypress and its spawned Chrome — float or send to workspace 5
[[on-window-detected]]
if.app-id = 'com.electron.cypress'
run = ['layout floating']

# Generic: float any "dialog-like" window (narrow/small)
# Aerospace auto-floats windows below a certain size by default
