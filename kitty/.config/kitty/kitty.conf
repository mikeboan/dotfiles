# Kitty config
# Docs: https://sw.kovidgoyal.net/kitty/conf/

# ===========================
# FONT
# ===========================
font_family      FiraCode Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        16.0
adjust_line_height 110%
disable_ligatures never

# Better rendering for nvim diagnostics (LSP underlines)
undercurl_style thin-sparse
modify_font underline_position -2
modify_font underline_thickness 200%

# ===========================
# APPEARANCE — Tokyo Night Storm
# ===========================
foreground #c0caf5
background #24283b
selection_foreground #c0caf5
selection_background #364a82
cursor #c0caf5
cursor_text_color #24283b
url_color #73daca

# normal
color0 #1d202f
color1 #f7768e
color2 #9ece6a
color3 #e0af68
color4 #7aa2f7
color5 #bb9af7
color6 #7dcfff
color7 #a9b1d6

# bright
color8 #414868
color9 #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5

background_opacity 1.0
cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 0

# Bold text uses brighter ANSI colors
bold_is_bright yes

# ===========================
# WINDOW
# ===========================
hide_window_decorations titlebar-only
window_padding_width 2 6 2 8
confirm_os_window_close 0

# Dim inactive panes
inactive_text_alpha 0.8

# ===========================
# TAB BAR (disabled — tmux handles windowing)
# ===========================
tab_bar_style hidden

# ===========================
# TERMINAL
# ===========================
scrollback_lines 10000
shell /bin/zsh --login
term xterm-kitty

# ===========================
# BELL
# ===========================
enable_audio_bell no
visual_bell_duration 0.075
visual_bell_color none

# ===========================
# CLIPBOARD
# ===========================
copy_on_select no
clipboard_control write-clipboard read-clipboard

# ===========================
# MOUSE
# ===========================
mouse_hide_wait 3.0
# Cmd+click to open URLs/file paths
open_url_with default
mouse_map cmd+left click ungrabbed mouse_handle_click link

# ===========================
# macOS
# ===========================
macos_option_as_alt yes
macos_quit_when_last_window_closed yes

# ===========================
# KEYBINDINGS
# ===========================

# Tmux window management (CMD → ALT passthrough)
map cmd+t send_text all \x1bt
map cmd+w send_text all \x1bw
map cmd+z send_text all \x1bz
map cmd+shift+[ send_text all \x1b,
map cmd+shift+] send_text all \x1b.

# CMD+N → Alt+N for tmux window switching
map cmd+1 send_text all \x1b1
map cmd+2 send_text all \x1b2
map cmd+3 send_text all \x1b3
map cmd+4 send_text all \x1b4
map cmd+5 send_text all \x1b5
map cmd+6 send_text all \x1b6
map cmd+7 send_text all \x1b7
map cmd+8 send_text all \x1b8
map cmd+9 send_text all \x1b9

# Clipboard
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard

# Font size
map cmd+equal change_font_size all +1.0
map cmd+minus change_font_size all -1.0
map cmd+0 change_font_size all 0

# Fullscreen
map cmd+ctrl+f toggle_fullscreen

# Clear screen (iTerm2-style CMD+K)
map cmd+k clear_terminal to_cursor active

# macOS Option key word movement (handled by macos_option_as_alt)
# but CMD movement still needs explicit bindings
map cmd+left send_text all \x01
map cmd+right send_text all \x05
