"$schema" = 'https://starship.rs/config-schema.json'

# Locked to Tokyo Night Storm (theme switcher removed 2026-07)
palette = 'tokyonight_storm'

format = """
$os\
$username\
$directory\
$git_branch\
$git_status\
$fill\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$conda\
$time\
$cmd_duration\
$line_break\
$character"""

[os]
disabled = false
style = "fg:lavender"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "fg:lavender"
style_root = "fg:lavender"
format = '[ $user ](bold $style)'

[directory]
style = "fg:sapphire"
format = "[ $path]($style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false
before_repo_root_style = "fg:sapphire"
repo_root_style = "bold fg:sapphire"
fish_style_pwd_dir_length = 1

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "fg:green"
format = '[[ $symbol $branch ](fg:green)]($style)'

[git_status]
style = "fg:green"
format = '[[($all_status$ahead_behind )](fg:green)]($style)'

[fill]
symbol = " "

[nodejs]
symbol = ""
style = "fg:yellow"
format = '[[ $symbol( $version) ](fg:yellow)]($style)'

[c]
symbol = " "
style = "fg:yellow"
format = '[[ $symbol( $version) ](fg:yellow)]($style)'

[rust]
symbol = ""
style = "fg:yellow"
format = '[[ $symbol( $version) ](fg:yellow)]($style)'

[golang]
symbol = ""
style = "fg:yellow"
format = '[[ $symbol( $version) ](fg:yellow)]($style)'

[php]
symbol = ""
style = "fg:yellow"
format = '[[ $symbol( $version) ](fg:yellow)]($style)'

[java]
symbol = " "
style = "fg:yellow"
format = '[[ $symbol( $version) ](fg:yellow)]($style)'

[kotlin]
symbol = ""
style = "fg:yellow"
format = '[[ $symbol( $version) ](fg:yellow)]($style)'

[haskell]
symbol = ""
style = "fg:yellow"
format = '[[ $symbol( $version) ](fg:yellow)]($style)'

[python]
symbol = ""
style = "fg:yellow"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:yellow)]($style)'

[docker_context]
symbol = ""
style = "fg:sapphire"
format = '[[ $symbol( $context) ](fg:sapphire)]($style)'

[conda]
symbol = "  "
style = "fg:sapphire"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "fg:lavender"
format = '[[  $time ](fg:lavender)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "fg:lavender"
disabled = false
show_notifications = true
min_time_to_notify = 45000

[palettes.tokyonight_storm]
red = "#f7768e"
yellow = "#e0af68"
green = "#9ece6a"
sapphire = "#7aa2f7"
lavender = "#b7bdf8"
